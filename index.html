<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Công thức pha chế · 7-Eleven</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
:root{--ink:#2d1b4e;--pur:#7b4fc4;--soft:#6b5a86;--glass:rgba(255,255,255,.55)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:'Be Vietnam Pro',system-ui,sans-serif;color:var(--ink);padding:max(20px,env(safe-area-inset-top)) 16px 40px;
background:radial-gradient(60% 40% at 8% 0,#d6c1f4,transparent),radial-gradient(50% 40% at 100% 25%,#c6ecdb,transparent),radial-gradient(60% 50% at 40% 100%,#f5cde3,transparent),#efe8fa;background-attachment:fixed}
.glass{background:var(--glass);backdrop-filter:blur(22px) saturate(180%);-webkit-backdrop-filter:blur(22px) saturate(180%);border:1px solid rgba(255,255,255,.75);box-shadow:0 8px 30px rgba(80,40,140,.12),inset 0 1px 0 rgba(255,255,255,.85)}
main{max-width:760px;margin:0 auto}
h1{font-family:'Playfair Display',serif;font-size:34px;margin:8px 4px 18px;letter-spacing:-.01em}
.bar{display:flex;gap:10px;margin-bottom:22px}
.sb{flex:1;display:flex;align-items:center;gap:10px;border-radius:999px;padding:0 18px;height:50px}
.sb input{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:16px;color:inherit;outline:0}
.btn{border-radius:999px;height:50px;padding:0 18px;border:1px solid rgba(255,255,255,.75);font:inherit;font-weight:500;color:var(--ink);display:flex;align-items:center;gap:8px;cursor:pointer;background:var(--glass);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px)}
body.edit #eb{background:var(--pur);color:#fff}
.pills{display:flex;flex-wrap:wrap;gap:10px}
.pill{display:flex;align-items:center;gap:9px;border-radius:999px;padding:6px 18px 6px 6px;font:inherit;font-weight:500;font-size:15px;color:var(--ink);cursor:pointer;transition:transform .15s}
.pill:active{transform:scale(.96)}
.pill img{width:34px;height:34px;border-radius:50%;object-fit:contain;padding:3px;background:#fff}
.pill.add{padding:6px 18px;color:var(--pur);border-style:dashed}
body.edit .pill:not(.add)::after{content:"✎";color:var(--pur);font-size:13px;margin-left:2px}
.empty{padding:40px 10px;text-align:center;color:var(--soft)}
:focus-visible{outline:3px solid var(--pur);outline-offset:2px}
.ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(45,27,78,.35);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);perspective:1500px;z-index:5}
.ov.on{display:flex}
.card{position:relative;width:min(440px,100%);transform-style:preserve-3d;transition:transform .85s cubic-bezier(.2,.8,.2,1)}
.card.back{transform:rotateY(180deg)}
.face{border-radius:28px;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.cf{background:#fff;max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(45,27,78,.35)}
.cb{position:absolute;inset:0;transform:rotateY(180deg);display:flex;align-items:center;justify-content:center;padding:30px;text-align:center;font-family:'Playfair Display',serif;font-size:30px;color:#fff;background:linear-gradient(160deg,#9a6fe0,#5b34a4)}
.im{background:#fff;text-align:center;padding:22px 0 0}
.im img{height:230px;max-width:80%;object-fit:contain;filter:drop-shadow(0 8px 12px rgba(80,40,140,.28))}
.bd{padding:6px 24px 26px}
.x{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(236,228,247,.9);color:var(--ink);font-size:18px;cursor:pointer;z-index:2}
h2{font-family:'Playfair Display',serif;font-size:27px;margin:8px 0 2px;text-align:center}
.en{display:block;text-align:center;font-style:italic;color:var(--pur)}
.ds{text-align:center;margin:6px 0 16px;color:var(--soft);font-size:14px}
.seg{display:flex;background:#ece4f7;border-radius:999px;padding:4px;margin-bottom:6px}
.seg button{flex:1;border:0;border-radius:999px;padding:9px 0;font:inherit;font-weight:600;background:none;color:var(--soft);cursor:pointer;transition:.25s}
.seg button.on{background:var(--pur);color:#fff;box-shadow:0 3px 10px rgba(123,79,196,.4)}
h3{font-size:15px;margin:20px 0 8px}
.ing{list-style:none;margin:0;padding:0}
.ing li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #ece4f7}
.ing b{color:var(--pur);white-space:nowrap}
ol{margin:0;padding-left:22px;line-height:1.55}
ol li{margin-bottom:6px}
.shelf{margin-top:20px;background:#ece4f7;border-radius:16px;padding:12px 16px;font-size:14px}
.sheet{width:min(520px,100%);max-height:92vh;overflow:auto;border-radius:28px;padding:22px;background:rgba(255,255,255,.82)}
.sheet h2{text-align:left;margin-top:0}
label{display:block;font-size:13px;color:var(--soft);margin:12px 0 0}
.sheet input,.sheet textarea{display:block;width:100%;margin-top:4px;padding:11px 13px;border-radius:14px;border:1px solid #d9cdee;background:#fff;font:inherit;font-size:15px;color:var(--ink)}
.row,.hd{display:grid;grid-template-columns:1fr 62px 62px 62px;gap:6px;margin-bottom:6px}
.hd{font-size:12px;color:var(--soft);padding:0 4px;text-align:center}
.hd span:first-child{text-align:left}
.row input{margin:0;padding:9px 8px}
.ir{display:flex;align-items:center;gap:14px;margin-top:12px}
.ir img{width:88px;height:112px;object-fit:contain;border-radius:14px;background:#ece4f7}
.ct{flex:1;font-size:13px;color:var(--soft)}
.ct label{display:flex;align-items:center;gap:8px;margin:0 0 8px}
.ct input[type=range]{flex:1;width:auto;margin:0;padding:0;border:0;accent-color:var(--pur)}
.ct input[type=checkbox]{width:auto;margin:0;accent-color:var(--pur)}
.acts{display:flex;gap:8px;margin-top:20px;justify-content:flex-end;flex-wrap:wrap}
.acts .btn{height:44px}
.main{background:var(--pur);color:#fff}
.danger{color:#c0392b;margin-right:auto}
@media(prefers-reduced-motion:reduce){.card{transition:none}}
</style>
</head>
<body>
<main>
<h1>Công thức pha chế</h1>
<div class="bar">
 <label class="sb glass" style="margin:0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7b4fc4" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="Tìm công thức…" autocomplete="off"></label>
 <button class="btn" id="eb" onclick="toggleEdit()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg><span id="ebt">Chỉnh sửa</span></button>
</div>
<div class="pills" id="pills"></div>
</main>

<div class="ov" id="ov" onclick="if(event.target===this)closeCard()">
 <div class="card back" id="card">
  <div class="face cb" id="cb"></div>
  <div class="face cf"><button class="x" onclick="closeCard()" aria-label="Đóng">✕</button><div id="cfc"></div></div>
 </div>
</div>

<div class="ov" id="ed" onclick="if(event.target===this)closeEd()">
 <div class="sheet glass">
  <h2 id="et"></h2>
  <label>Tên món<input id="fn"></label>
  <label>Tên tiếng Anh<input id="fe"></label>
  <label>Mô tả ngắn<input id="fd"></label>
  <div class="ir"><img id="fi" alt=""><div class="ct"><button class="btn" type="button" style="height:40px;margin-bottom:10px" onclick="fileIn.click()">Chọn ảnh</button><input type="file" id="fileIn" accept="image/*" hidden><label><input type="checkbox" id="cut" checked> Cắt nền thành sticker</label><label>Độ nhạy <input type="range" id="tol" min="10" max="110" value="45"></label></div></div>
  <p class="ds" style="text-align:left;margin:6px 0 0;font-size:12px">Ảnh nền đơn sắc (trắng, xám…) cho kết quả đẹp nhất. Còn dính nền thì tăng độ nhạy, bị mất viền món thì giảm.</p>
  <h3>Nguyên vật liệu theo size</h3>
  <div class="hd"><span>Tên</span><span>S</span><span>M</span><span>L</span></div>
  <div id="rows"></div>
  <button class="btn" type="button" style="height:38px" onclick="addRow()">+ Thêm nguyên liệu</button>
  <label>Cách pha chế (mỗi dòng một bước)<textarea id="fs" rows="5"></textarea></label>
  <label>Hạn sử dụng<input id="fh" placeholder="VD: Bán thành phẩm 24 giờ"></label>
  <div class="acts"><button class="btn danger" id="dl" onclick="delR()">Xóa món</button><button class="btn" onclick="closeEd()">Hủy</button><button class="btn main" onclick="saveEd()">Lưu</button></div>
 </div>
</div>

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').toLowerCase();
const seed=()=>[
 ['Sữa Tươi Khoai Môn','Taro Crush with Fresh Milk','êm dịu nhẹ nhàng','Bán thành phẩm 24 giờ'],
 ['Trà Sữa Khoai Môn','Taro Crush Milk Tea','bản nâng cấp, paste khoai môn thật','Bán thành phẩm 24 giờ · trưng bày 6 giờ'],
 ['Latte Khoai Môn','Taro Crush Latte','cà phê gặp vị khoai môn, tỉnh táo','Bán thành phẩm 24 giờ'],
 ['Matcha Khoai Môn','Taro Crush Matcha','matcha gặp khoai môn, béo bùi','Bán thành phẩm 24 giờ']
].map((a,i)=>({id:'seed'+i,name:a[0],en:a[1],desc:a[2],shelf:a[3],img:IMGS[i],ing:[],steps:[],ts:4-i}));
let R=[],q='',cur=null,size='S',edId=null,edImg='',edIm=null;

async function load(){
 let ok=false;
 try{
  if(SHEET_API_URL){const j=await (await fetch(SHEET_API_URL+'?action=list')).json();if(Array.isArray(j.items)){R=j.items;ok=true}}
 }catch(e){}
 if(!ok){try{R=JSON.parse(localStorage.getItem(KEY))}catch(e){}}
 if(!Array.isArray(R)||!R.length){R=seed();if(ok)R.forEach(r=>persist('upsert',{item:r}))}
 R.sort((a,b)=>(b.ts||0)-(a.ts||0));
 render();
}
function persist(act,payload){
 try{localStorage.setItem(KEY,JSON.stringify(R))}catch(e){}
 if(SHEET_API_URL)fetch(SHEET_API_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:act,...payload})}).catch(()=>{});
}
function render(){
 const k=norm(q), list=R.filter(r=>!k||norm(r.name+' '+r.en+' '+(r.ing||[]).map(i=>i.n).join(' ')).includes(k));
 let h=(document.body.classList.contains('edit')?'<button class="pill glass add" onclick="openEd()">+ Thêm món</button>':'')+list.map(r=>`<button class="pill glass" onclick="pick('${r.id}')">${r.img?`<img src="${r.img}" alt="">`:''}${esc(r.name)}</button>`).join('');
 if(!h)h=`<div class="empty">Không tìm thấy công thức “${esc(q)}”.<br>Bấm Chỉnh sửa để thêm món mới.</div>`;
 $('#pills').innerHTML=h;
}
$('#q').addEventListener('input',e=>{q=e.target.value;render()});
function toggleEdit(){const on=document.body.classList.toggle('edit');$('#ebt').textContent=on?'Xong':'Chỉnh sửa';render()}
function pick(id){document.body.classList.contains('edit')?openEd(id):openCard(id)}

function openCard(id){
 cur=R.find(r=>r.id===id);size='S';
 $('#cb').textContent=cur.name;drawCard();
 const c=$('#card');c.classList.add('back');$('#ov').classList.add('on');
 requestAnimationFrame(()=>requestAnimationFrame(()=>c.classList.remove('back')));
}
function setSize(s){size=s;drawCard()}
function drawCard(){
 const r=cur, has=(r.ing&&r.ing.length)||(r.steps&&r.steps.length);
 $('#cfc').innerHTML=`<div class="im">${r.img?`<img src="${r.img}" alt="${esc(r.name)}">`:''}</div><div class="bd">
 <h2>${esc(r.name)}</h2>${r.en?`<span class="en">${esc(r.en)}</span>`:''}${r.desc?`<p class="ds">${esc(r.desc)}</p>`:'<br>'}
 <div class="seg">${SZ.map(s=>`<button class="${s===size?'on':''}" onclick="setSize('${s}')">Size ${s}</button>`).join('')}</div>
 ${has?`<h3>Nguyên vật liệu · size ${size}</h3><ul class="ing">${r.ing.map(i=>`<li><span>${esc(i.n)}</span><b>${esc(i[size]||'—')}</b></li>`).join('')}</ul>
 <h3>Cách pha chế</h3><ol>${r.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>`
 :`<p class="empty">Chưa có công thức cho món này.<br>Bấm Chỉnh sửa rồi chọn món để nhập.</p>`}
 ${r.shelf?`<div class="shelf"><b>Hạn sử dụng:</b> ${esc(r.shelf)}</div>`:''}</div>`;
}
function closeCard(){$('#ov').classList.remove('on')}

function addRow(i={}){
 const d=document.createElement('div');d.className='row';
 d.innerHTML=`<input placeholder="Nguyên liệu" value="${esc(i.n)}">`+SZ.map(s=>`<input placeholder="—" value="${esc(i[s])}">`).join('');
 $('#rows').appendChild(d);
}
function openEd(id){
 const r=R.find(x=>x.id===id);edId=r?r.id:null;edImg=r?r.img:'';
 $('#et').textContent=r?'Sửa công thức':'Thêm món mới';
 $('#fn').value=r?r.name:'';$('#fe').value=r?r.en:'';$('#fd').value=r?r.desc:'';
 $('#fs').value=r?r.steps.join('\n'):'';$('#fh').value=r?r.shelf:'';
 $('#fi').src=edImg||'';edIm=null;$('#cut').checked=true;$('#tol').value=45;$('#rows').innerHTML='';
 (r&&r.ing.length?r.ing:[{}]).forEach(addRow);
 $('#dl').style.display=r?'':'none';$('#ed').classList.add('on');
}
function closeEd(){$('#ed').classList.remove('on')}
function plain(im){
 const s=Math.min(1,280/Math.max(im.width,im.height)),c=document.createElement('canvas');
 c.width=im.width*s;c.height=im.height*s;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);
 x.drawImage(im,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.8);
}
// Cắt nền kiểu die-cut: xoá vùng nền cùng màu nối với mép ảnh, rồi thêm viền trắng quanh hình
function sticker(im,tol,maxd){
 const RD=6,PAD=8,s=Math.min(1,(maxd-2*PAD)/Math.max(im.width,im.height)),
  w=Math.round(im.width*s),h=Math.round(im.height*s),N=w*h,
  c=document.createElement('canvas');c.width=w;c.height=h;
 const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(im,0,0,w,h);
 const d=x.getImageData(0,0,w,h),p=d.data;
 if(p[3]>=10||p[(w-1)*4+3]>=10){
  const cn=[0,w-1,N-w,N-1],bg=[0,1,2].map(k=>cn.reduce((a,i)=>a+p[i*4+k],0)/4),t2=tol*tol,seen=new Uint8Array(N),st=[];
  const ok=i=>{const a=p[i*4]-bg[0],b=p[i*4+1]-bg[1],e=p[i*4+2]-bg[2];return a*a+b*b+e*e<=t2};
  const push=i=>{if(!seen[i]&&ok(i)){seen[i]=1;st.push(i)}};
  for(let i=0;i<w;i++){push(i);push(N-w+i)}
  for(let j=0;j<h;j++){push(j*w);push(j*w+w-1)}
  while(st.length){const i=st.pop(),cx=i%w;if(cx>0)push(i-1);if(cx<w-1)push(i+1);if(i>=w)push(i-w);if(i<N-w)push(i+w)}
  for(let i=0;i<N;i++){const cx=i%w;
   p[i*4+3]=seen[i]||(cx>0&&seen[i-1])||(cx<w-1&&seen[i+1])||(i>=w&&seen[i-w])||(i<N-w&&seen[i+w])?0:255}
  x.putImageData(d,0,0);
 }
 const sl=document.createElement('canvas');sl.width=w;sl.height=h;const sx=sl.getContext('2d');
 sx.drawImage(c,0,0);sx.globalCompositeOperation='source-in';sx.fillStyle='#fff';sx.fillRect(0,0,w,h);
 const o=document.createElement('canvas');o.width=w+2*PAD;o.height=h+2*PAD;const ox=o.getContext('2d');
 [RD,RD/2].forEach(r=>{for(let k=0;k<32;k++){const a=k*Math.PI/16;ox.drawImage(sl,PAD+r*Math.cos(a),PAD+r*Math.sin(a))}});
 ox.drawImage(c,PAD,PAD);
 let u=o.toDataURL('image/webp',.82);if(u.indexOf('data:image/webp')!==0)u=o.toDataURL('image/png');
 return u.length>140000&&maxd>140?sticker(im,tol,Math.round(maxd*.8)):u;
}
function runStk(){if(!edIm)return;edImg=$('#cut').checked?sticker(edIm,+$('#tol').value,280):plain(edIm);$('#fi').src=edImg}
let tm;$('#tol').oninput=()=>{clearTimeout(tm);tm=setTimeout(runStk,120)};$('#cut').onchange=runStk;
fileIn.onchange=e=>{
 const f=e.target.files[0];if(!f)return;const im=new Image();
 im.onload=()=>{edIm=im;runStk()};im.src=URL.createObjectURL(f);e.target.value='';
};
function saveEd(){
 const name=$('#fn').value.trim();if(!name){$('#fn').focus();return}
 const ing=[...document.querySelectorAll('#rows .row')].map(d=>{const v=[...d.children].map(x=>x.value.trim());return{n:v[0],S:v[1],M:v[2],L:v[3]}}).filter(i=>i.n);
 const old=R.find(x=>x.id===edId),r={id:edId||'r'+Date.now(),ts:old?(old.ts||0):Date.now(),name,en:$('#fe').value.trim(),desc:$('#fd').value.trim(),shelf:$('#fh').value.trim(),img:edImg,ing,
  steps:$('#fs').value.split('\n').map(s=>s.trim()).filter(Boolean)};
 const i=R.findIndex(x=>x.id===r.id);i>=0?R[i]=r:R.unshift(r);
 persist('upsert',{item:r});closeEd();render();
}
function delR(){
 if(!confirm('Xóa món này khỏi danh sách công thức?'))return;
 R=R.filter(x=>x.id!==edId);persist('delete',{id:edId});closeEd();render();
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeCard();closeEd()}});
load();
</script>
