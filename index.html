<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>7-Eleven · Công thức Cà phê</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
:root{--bg:#faf5ee;--panel:#fff;--fg:#2b1d12;--fg2:#6a5644;--line:#ead9c6;--accent:#97663b;--accent2:#c08a4d;--deep:#4a2c17;
--red:#d62020;--orange:#f66e22;--green:#09734f;--cardbg:#fff;--shadow:0 10px 16px rgba(80,45,15,.22);
--herobg:radial-gradient(90% 80% at 12% 0%,#f3e3cc,transparent 62%),radial-gradient(80% 70% at 95% 10%,#d9efe4,transparent 60%),#faf5ee;
--secalt:#f2e6d5;--secaltfg:#4a2c17;}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);font-family:"Be Vietnam Pro","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;}
body{overflow-x:hidden;}
h1,h2,h3,h4{font-family:"Fraunces",Georgia,serif;margin:0;letter-spacing:-.01em;}
.wrap{max-width:1040px;margin:0 auto;padding:0 26px;}
.tri{height:7px;background:linear-gradient(90deg,#f66e22 0 33.3%,#09734f 33.3% 66.6%,#e91926 66.6%);}
.hero{background:var(--herobg);padding:54px 0 38px;border-bottom:2px solid var(--line);}
.kick{display:inline-flex;align-items:center;gap:9px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:16px;}
.kick i{width:24px;height:2px;background:var(--accent);display:block;}
.hero h1{font-size:clamp(40px,8vw,72px);line-height:.96;}
.hero h1 span{color:var(--accent);}
.lede{margin-top:16px;font-size:clamp(15px,2.1vw,18px);color:var(--fg2);max-width:64ch;line-height:1.6;}
.facts{display:flex;flex-wrap:wrap;margin-top:28px;border-top:1px solid var(--line);}
.fact{flex:1 1 150px;padding:15px 16px 15px 0;border-right:1px solid var(--line);}
.fact:last-child{border-right:none;}
.fact b{display:block;font-family:"Fraunces",serif;font-size:23px;}
.fact span{font-size:11.5px;color:var(--fg2);}
section{padding:48px 0;border-bottom:1px solid var(--line);}
section.alt{background:var(--secalt);color:var(--secaltfg);}
.sec-head{display:flex;align-items:baseline;gap:13px;margin-bottom:6px;}
.sec-num{font-family:"Fraunces",serif;font-size:13px;font-weight:700;color:var(--bg);background:var(--fg);border-radius:50%;width:28px;height:28px;display:grid;place-items:center;flex:none;}
section.alt .sec-num{background:var(--secaltfg);color:var(--secalt);}
.sec-head h2{font-size:clamp(23px,3.7vw,32px);}
.sec-note{color:var(--fg2);font-size:14px;line-height:1.6;margin:0 0 24px 41px;max-width:68ch;}
section.alt .sec-note{color:var(--secaltfg);opacity:.85;}
.sub{margin:26px 0 6px;font-size:18px;}
.sm{font-size:12px;color:var(--fg2);}
/* size section */
.szbox{display:grid;grid-template-columns:1.25fr 1fr;gap:18px;align-items:stretch;}
.panel{background:var(--cardbg);border:1px solid var(--line);border-radius:16px;padding:18px 20px;}
.panel h4{font-size:16px;margin-bottom:8px;}
.szsvg,.vsvg{width:100%;height:auto;display:block;}
.rules{margin:0;padding-left:18px;font-size:13px;color:var(--fg2);line-height:1.7;}
.rules b{color:var(--fg);}
.vlegend{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
.vtag{font-size:11.5px;font-weight:800;border:1.5px solid;border-radius:8px;padding:5px 10px;background:#fff;}
.vtag.o{color:#d9611a;border-color:#f27c21;}.vtag.b{color:#1f2fe0;border-color:#1f2fe0;}
/* matrix */
.mxwrap{overflow-x:auto;border-radius:14px;border:1px solid var(--line);background:#fff;}
.mx{border-collapse:collapse;table-layout:fixed;width:100%;min-width:900px;font-size:12px;text-align:center;}
.mx th,.mx td{border:1px solid #cfcfcf;padding:9px 5px;}
.mx th.g{background:#176e4e;color:#fff;font-weight:600;}
.mx th.b{background:#cde1f3;color:#222;font-weight:600;}
.mx th.rowh{background:#fff;font-weight:500;color:#444;white-space:nowrap;width:78px;}
.mx th{font-size:11.5px;}
.mx td{height:48px;color:#222;font-size:15px;}
.mx td.tk{background:#f4fbf7;font-weight:700;}
/* lanes */
.rlane{background:var(--cardbg);border:1px solid var(--line);border-top:5px solid var(--lc);border-radius:16px;padding:18px 18px 14px;margin-bottom:16px;}
.rtitle{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px;}
.rtitle h4{font-size:19px;color:var(--lc);}
.rtitle span{font-size:12px;color:var(--fg2);}
.rbody{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:stretch;}
.rbody.nophoto{grid-template-columns:1fr;}
.rphoto{background:linear-gradient(180deg,#f6ead9,#fff);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:10px 6px;}
.rphoto img{max-width:100%;max-height:200px;width:auto;height:auto;filter:drop-shadow(var(--shadow));}
.rphoto span{font-size:11px;font-weight:700;color:var(--lc);margin-top:6px;}
.rsteps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
.rstep{background:#fcf8f2;border:1px solid var(--line);border-radius:13px;padding:10px;display:flex;flex-direction:column;min-width:0;}
.rhead{display:flex;align-items:center;gap:7px;margin-bottom:6px;}
.rnum{width:24px;height:24px;border-radius:50%;background:var(--lc);color:#fff;font-weight:700;font-size:12px;display:grid;place-items:center;flex:none;font-family:"Fraunces",serif;}
.rname{font-size:10.6px;font-weight:800;letter-spacing:.06em;color:var(--lc);}
.rimg{height:150px;display:flex;justify-content:center;align-items:flex-end;margin-bottom:8px;}
.csvg{height:150px;width:auto;}
.bl{margin:0 0 6px;padding-left:15px;font-size:12px;line-height:1.5;color:var(--fg);}
.bl li{margin-bottom:3px;}
.pl{font-size:12px;line-height:1.5;color:var(--fg);margin:0 0 6px;}
.pl.it{font-style:italic;font-weight:600;}
.pl.red{color:var(--red);}
.mk{font-size:12px;line-height:1.45;margin:0 0 6px;background:#fff35a;padding:2px 5px;border-radius:3px;color:#222;}
em.r{font-style:normal;color:var(--red);font-weight:700;}
.szrows{display:grid;gap:5px;margin-top:6px;}
.szr{display:grid;grid-template-columns:62px 1fr;gap:6px;align-items:start;background:#eaf0f8;border-radius:8px;padding:5px 7px;font-size:11.5px;line-height:1.35;}
.szr b{font-size:10.2px;color:var(--lc);letter-spacing:.02em;}
.szr small{display:block;color:var(--fg2);font-size:10.5px;}
.chips{margin-top:6px;}
.rchip{display:inline-block;font-size:10.2px;font-weight:700;background:#fff;border:1px solid var(--line);border-radius:100px;padding:2px 8px;margin:0 4px 3px 0;}
.rnote{font-size:12px;color:var(--fg2);margin:10px 0 0;padding-top:9px;border-top:1px dashed var(--line);line-height:1.6;}
.rnote b{color:var(--fg);}
/* sensory */
.sens{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.sbox{border-radius:16px;padding:20px;background:#fff;border:1px solid var(--line);}
.pill{display:inline-flex;align-items:center;gap:10px;font-size:16px;font-weight:700;border-radius:14px;padding:8px 16px 8px 8px;margin-bottom:12px;}
.pill i{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-style:normal;font-size:20px;font-weight:800;}
.pill.ok{background:#b5d8a8;}.pill.ok i{background:#2a9d6a;}
.pill.no{background:#fbe3e3;}.pill.no i{background:#e8453c;}
.swatches{display:flex;gap:18px;margin:2px 0 6px;}
.swf{margin:0;text-align:center;}
.swf figcaption{font-size:11px;color:var(--fg2);margin-top:4px;max-width:120px;}
.sw{width:56px;height:70px;border-radius:6px 6px 14px 14px;border:2px solid #d8c9b8;position:relative;}
.sw span{position:absolute;left:0;right:0;bottom:-18px;text-align:center;font-size:9.5px;color:var(--fg2);}
.sbox h5{font-size:14px;margin:14px 0 4px;font-family:"Be Vietnam Pro",sans-serif;}
.sbox ul{margin:0;padding-left:18px;font-size:13px;line-height:1.65;color:var(--fg2);}
.kill{margin-top:16px;font-weight:700;font-style:italic;font-size:14px;}
footer{padding:36px 0 calc(36px + env(safe-area-inset-bottom,0px));text-align:center;color:var(--fg2);font-size:12.5px;line-height:1.7;}
footer .fh{font-family:"Fraunces",serif;font-size:20px;color:var(--fg);margin-bottom:6px;}
@media (max-width:980px){.rbody{grid-template-columns:1fr;}.rphoto{flex-direction:row;gap:10px;justify-content:center;}.rsteps{grid-template-columns:repeat(2,1fr);}.szbox,.sens{grid-template-columns:1fr;}}
@media (max-width:560px){.rsteps{grid-template-columns:1fr;}.facts{flex-direction:column;}.fact{border-right:none;border-bottom:1px solid var(--line);}.sec-note{margin-left:0;}}

:root{padding-top:env(safe-area-inset-top,0px);color-scheme:light}
.hero{padding:30px 0 22px}.hero h1{font-size:clamp(34px,7vw,56px)}.hero .lede{margin-top:12px}
input,textarea{font:inherit;color:var(--fg);background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 13px;width:100%}
textarea{resize:vertical}input:focus,textarea:focus{outline:2px solid var(--accent)}
.a-tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.a-tools input{flex:1 1 220px;width:auto}
.a-btn{font:700 13.5px "Be Vietnam Pro",sans-serif;border:1px solid var(--line);background:#fff;color:var(--fg);border-radius:12px;padding:9px 15px;cursor:pointer}
.a-btn.p{background:var(--accent);border-color:var(--accent);color:#fff}.a-btn.d{color:var(--red)}
.a-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.a-chip{font:700 12.5px "Be Vietnam Pro",sans-serif;border:1px solid var(--line);background:#fff;color:var(--fg2);border-radius:99px;padding:6px 14px;cursor:pointer}
.a-chip.on{background:var(--fg);border-color:var(--fg);color:var(--bg)}
main.wrap{padding-top:26px;padding-bottom:10px}.a-grp{margin-bottom:30px}
.a-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px;margin-top:14px}
.a-card{all:unset;box-sizing:border-box;cursor:pointer;background:var(--cardbg);border:1px solid var(--line);border-top:5px solid var(--lc);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s}
.a-card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}.a-card:focus-visible{outline:2px solid var(--accent)}
.a-im{background:linear-gradient(180deg,#f6ead9,#fff);height:160px;display:flex;align-items:flex-end;justify-content:center;padding:10px 6px;font-size:40px}
.a-im img{max-width:100%;max-height:140px;filter:drop-shadow(var(--shadow))}.a-im .csvg{height:140px}
.a-tx{padding:10px 13px 13px}.a-tx h4{font-size:16px;color:var(--lc);line-height:1.25}.a-tx span{font-size:11.5px;color:var(--fg2);display:block;margin-top:3px}
#empty{text-align:center;color:var(--fg2);padding:30px 0}
.a-ov{position:fixed;inset:0;background:rgba(40,20,8,.55);z-index:20;overflow:auto;padding:16px 10px calc(16px + env(safe-area-inset-bottom,0px));backdrop-filter:blur(3px)}.a-ov[hidden]{display:none}
.a-sheet{background:var(--bg);max-width:1040px;margin:0 auto;border-radius:20px;padding:14px 16px 20px}
.a-sbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;position:sticky;top:-14px;background:var(--bg);padding:4px 0;z-index:3}
.a-sheet .rlane{margin-bottom:0}.a-sheet section{padding:30px 0}
.a-f label{display:block;font-size:12px;font-weight:700;color:var(--fg2);margin:12px 0 4px}
.r2{display:flex;gap:8px;margin-bottom:6px}.r2 .sn{width:52px;flex:none}.r2 button{flex:none}
.se{border:1px dashed var(--line);border-radius:12px;padding:10px;margin-bottom:8px;display:grid;gap:6px;background:#fff}
.a-th{height:56px;display:flex;justify-content:center}.a-th .csvg{height:56px}
.pv{display:flex;gap:10px;align-items:center}.pv img{width:72px;height:72px;object-fit:contain;border-radius:12px;background:#f6ead9}
.hint{font-size:12px;color:var(--fg2);margin:4px 0 0}.acts{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}.acts .p{flex:1}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:13px;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}#toast.on{opacity:1}

<div class="tri"></div><header class="hero"><div class="wrap"><div class="kick"><i></i>7-Eleven · Nhóm Cà phê</div><h1>Công thức <span>Cà phê</span></h1><p class="lede">Bấm vào từng món để xem công thức đầy đủ: số shot, số pump, vạch đong, cách đổ đá và cách phục vụ cho từng size ly.</p>

const hyd=r=>{const sd=sm[r.id];return{...r,photo:r.photo==="@seed"?sd.photo:r.photo,steps:r.steps.map(s=>s.svg&&s.svg[0]==="@"?{...s,oi:+s.svg.slice(1),svg:sd.steps[+s.svg.slice(1)].svg}:s)}};
function all(){const a=SEED.filter(r=>ov[r.id]!==null).map(r=>ov[r.id]?hyd(ov[r.id]):{...r,steps:r.steps.map((s,i)=>({...s,oi:i}))});for(const id in ov)if(!sm[id]&&ov[id])a.push(ov[id]);return a}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(ov));return true}catch(e){toast("Bộ nhớ trình duyệt đầy, chưa lưu được");return false}}
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");setTimeout(()=>e.classList.remove("on"),2200)}
const card=r=>`<button class="a-card" style="--lc:${E(r.color)}" data-a="show" data-id="${r.id}"><div class="a-im">${r.photo?`<img src="${r.photo}" alt="${E(r.name)}" loading="lazy">`:(r.steps.find(s=>s.svg)||{svg:"☕"}).svg}</div><div class="a-tx"><h4>${E(r.name)}</h4><span>${E(r.sub)}</span></div></button>`;
function render(){const L=all(),cats=["Tất cả",...new Set(L.map(r=>r.cat))];if(!cats.includes(cat))cat="Tất cả";
 $("#chips").innerHTML=cats.map(c=>`<button class="a-chip${c===cat?" on":""}" data-a="cat" data-v="${E(c)}">${E(c)}</button>`).join("");
 const q=nz($("#q").value.trim());
 const f=L.filter(r=>(cat==="Tất cả"||r.cat===cat)&&(!q||nz([r.name,r.sub,r.cat,r.note,...r.steps.flatMap(s=>[s.name,...s.mk,...s.items,...(s.notes||[]).map(n=>n[1]),...s.sizes.flat()])].join(" ")).includes(q)));
 $("#grid").innerHTML=[...new Set(f.map(r=>r.cat))].map(c=>`<div class="a-grp"><div class="sec-head"><span class="sec-num">${String(cats.indexOf(c)).padStart(2,"0")}</span><h2>${E(c)}</h2></div><div class="a-grid">${f.filter(r=>r.cat===c).map(card).join("")}</div></div>`).join("");
 $("#empty").hidden=f.length>0}
function openOv(){$("#ov").hidden=false;$("#ov").scrollTop=0;document.body.style.overflow="hidden"}
function closeOv(){$("#ov").hidden=true;document.body.style.overflow="";cur=null}
const stp=s=>`<div class="rstep"><div class="rhead"><span class="rnum">${E(s.n)}</span><span class="rname">${E(s.name)}</span></div>${s.svg?`<div class="rimg">${s.svg}</div>`:""}${s.mk.map(m=>`<p class="mk">${md(m)}</p>`).join("")}${s.sizes.length?`<div class="szrows">${s.sizes.map(z=>`<div class="szr"><b>${E(z[0])}</b><span>${md(z[1])}${z[2]?`<small>${E(z[2])}</small>`:""}</span></div>`).join("")}</div>`:""}${s.items.length?`<ul class="bl">${s.items.map(i=>`<li>${md(i)}</li>`).join("")}</ul>`:""}${(s.notes||[]).map(n=>`<p class="${E(n[0])}">${md(n[1])}</p>`).join("")}</div>`;
const lane=r=>`<div class="rlane" style="--lc:${E(r.color)}"><div class="rtitle"><h4>${E(r.name)}</h4><span>${E(r.sub)}</span></div><div class="rbody${r.photo?"":" nophoto"}">${r.photo?`<div class="rphoto"><img src="${r.photo}" alt="${E(r.name)}"><span>Thành phẩm</span></div>`:""}<div class="rsteps">${r.steps.map(stp).join("")}</div></div>${r.note?`<div class="rnote">${md(r.note)}</div>`:""}</div>`;
function show(id){const r=all().find(x=>x.id===id);if(!r)return;cur=id;
 $("#sheet").innerHTML=`<div class="a-sbar"><button class="a-btn" data-a="close">✕ Đóng</button><button class="a-btn" data-a="edit">✎ Chỉnh sửa</button></div>${lane(r)}`;openOv()}
const lines=v=>v.split("\n").map(x=>x.trim()).filter(Boolean);
const stepEd=(s,i)=>`<div class="se" data-i="${i}">${s.svg?`<div class="a-th">${s.svg}</div>`:""}<div class="r2"><input class="sn" value="${E(s.n)}" placeholder="#"><input class="sname" value="${E(s.name)}" placeholder="Tên bước (BASE, FLAVOR…)"><button type="button" class="a-btn d" data-a="rmstep">Xoá</button></div><textarea class="smk" rows="1" placeholder="Dòng tô vàng nổi bật (tuỳ chọn)">${E(s.mk.join("\n"))}</textarea><textarea class="sit" rows="3" placeholder="Các ý, mỗi dòng một ý">${E(s.items.join("\n"))}</textarea><textarea class="ssz" rows="2" placeholder="Theo size, mỗi dòng: S · 360ml | 2 shots | vào Jug">${E(s.sizes.map(z=>z[2]?z.join(" | "):z.slice(0,2).join(" | ")).join("\n"))}</textarea><textarea class="snt" rows="1" placeholder="Ghi chú nhỏ (tuỳ chọn)">${E((s.notes||[]).map(n=>n[1]).join("\n"))}</textarea></div>`;
function edit(id){const r=id?all().find(x=>x.id===id):{cat:cat==="Tất cả"?"":cat,name:"",sub:"",color:"#97663b",photo:"",steps:[{n:"1",name:"BASE",mk:[],items:[],sizes:[],notes:[]}],note:""};
 cur=id;ph=r.photo;dr=r.steps.map(s=>({...s}));const cats=[...new Set(all().map(x=>x.cat))];
 $("#sheet").innerHTML=`<div class="a-sbar"><button class="a-btn" data-a="${id?"show":"close"}" data-id="${id||""}">← Huỷ</button><b>${id?"Chỉnh sửa món":"Thêm món mới"}</b></div><div class="a-f">
<label>Tên món *</label><input id="fn" value="${E(r.name)}"><label>Nhóm</label><input id="fc" list="cl" value="${E(r.cat)}" placeholder="VD: Cà phê pha máy"><datalist id="cl">${cats.map(c=>`<option value="${E(c)}">`).join("")}</datalist>
<label>Mô tả ngắn (size, dung tích…)</label><input id="fs" value="${E(r.sub)}"><label>Màu nhấn</label><input id="fk" type="color" value="${E(r.color)}" style="height:40px;padding:3px">
<label>Hình thành phẩm</label><div class="pv"><img id="pi" ${ph?`src="${ph}"`:"hidden"}><input id="fp" type="file" accept="image/*"><button type="button" class="a-btn" data-a="rmph">Bỏ ảnh</button></div>
<label>Các bước (hình minh hoạ của bước được giữ nguyên)</label><div id="sts">${dr.map(stepEd).join("")}</div><button type="button" class="a-btn" data-a="addstep">＋ Thêm bước</button><p class="hint">Gõ **chữ** để tô đỏ đậm, __chữ__ để in đậm đen.</p>
<label>Ghi chú cuối công thức</label><textarea id="fnote" rows="2">${E(r.note)}</textarea>
<div class="acts"><button class="a-btn p" data-a="save">Lưu</button>${id?`<button class="a-btn d" data-a="del">${sm[id]?"Ẩn món":"Xoá món"}</button>`:""}${id&&sm[id]&&ov[id]?`<button class="a-btn" data-a="reset">Khôi phục bản gốc</button>`:""}</div></div>`;openOv()}
function save(){const name=$("#fn").value.trim();if(!name){toast("Hãy nhập tên món");return}
 const id=cur||"u"+Date.now().toString(36);
 const steps=[...document.querySelectorAll(".se")].map((e,k)=>{const o=dr[+e.dataset.i]||{},nt=lines(e.querySelector(".snt").value);return{n:e.querySelector(".sn").value.trim()||String(k+1),name:e.querySelector(".sname").value.trim(),mk:lines(e.querySelector(".smk").value),items:lines(e.querySelector(".sit").value),sizes:lines(e.querySelector(".ssz").value).map(l=>{const p=l.split("|").map(x=>x.trim());return[p[0]||"",p[1]||"",p[2]||""]}),notes:nt.map((t,j)=>[o.notes&&o.notes[j]?o.notes[j][0]:"pl it",t]),svg:o.svg&&sm[id]?"@"+o.oi:o.svg||""}}).filter(s=>s.name||s.svg||s.mk.length||s.items.length||s.sizes.length||s.notes.length);
 const prev=ov[id];ov[id]={id,cat:$("#fc").value.trim()||"Khác",name,sub:$("#fs").value.trim(),color:$("#fk").value,photo:sm[id]&&ph===sm[id].photo?"@seed":ph,steps,note:$("#fnote").value.trim()};
 if(!persist()){if(prev===undefined)delete ov[id];else ov[id]=prev;return}
 render();toast("Đã lưu");show(id)}
function del(){if(!confirm("Xoá món này?"))return;if(sm[cur])ov[cur]=null;else delete ov[cur];persist();closeOv();render();toast("Đã xoá")}
function pick(file){const img=new Image,u=URL.createObjectURL(file);img.onload=()=>{const k=Math.min(1,700/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=img.width*k;c.height=img.height*k;c.getContext("2d").drawImage(img,0,0,c.width,c.height);ph=c.toDataURL("image/png");const p=$("#pi");p.src=ph;p.hidden=false;URL.revokeObjectURL(u)};img.src=u}
document.addEventListener("click",e=>{if(e.target.id==="ov")return closeOv();const t=e.target.closest("[data-a]");if(!t)return;const a=t.dataset.a;
 if(a==="show")show(t.dataset.id||cur);else if(a==="close")closeOv();else if(a==="cat"){cat=t.dataset.v;render()}
 else if(a==="add")edit(null);else if(a==="edit")edit(cur);else if(a==="save")save();else if(a==="del")del();
 else if(a==="ref"){$("#sheet").innerHTML=`<div class="a-sbar"><button class="a-btn" data-a="close">✕ Đóng</button><b>Bảng tham khảo</b></div>`+REF;openOv()}
 else if(a==="reset"){delete ov[cur];persist();render();show(cur);toast("Đã khôi phục")}
 else if(a==="rmph"){ph="";const p=$("#pi");p.hidden=true;p.removeAttribute("src")}
 else if(a==="addstep"){const d=document.createElement("div");d.innerHTML=stepEd({n:String($("#sts").children.length+1),name:"",mk:[],items:[],sizes:[],notes:[]},-1);$("#sts").append(d.firstChild)}
 else if(a==="rmstep")t.closest(".se").remove()});
document.addEventListener("change",e=>{if(e.target.id==="fp"&&e.target.files[0])pick(e.target.files[0])});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#ov").hidden)closeOv()});
$("#q").addEventListener("input",render);render();
</script></body></html>
